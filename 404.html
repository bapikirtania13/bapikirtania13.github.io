<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved) {
          document.documentElement.setAttribute('data-theme', saved);
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Kirtania</title>
  <meta name="description" content="The page you are looking for could not be found." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page-404">
    <div>
      <h1 class="gradient-text">404</h1>
      <h2 style="font-size: 1.8rem; margin-bottom: 12px; font-weight: 700;">Page Not Found</h2>
      <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
      <div class="btn-group" style="justify-content: center;">
        <a href="index.html" class="btn btn-primary">Return to Homepage</a>
        <a href="index.html#apps" class="btn btn-outline">Explore Applications</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
